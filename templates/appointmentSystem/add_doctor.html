{% extends "base.html" %}

{% block title %}
    Add Doctor
{% endblock %}

{% block content %}

<h1>Add Doctor</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Add Doctor
    </button>

    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
